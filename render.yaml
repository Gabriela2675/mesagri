# =============================================================================
# Mesagri en Render (plan gratis) con la base de datos MySQL en Aiven (plan gratis)
#
# 1. En Render: New → Blueprint → elige este repositorio. Render lee este archivo.
# 2. Te pedirá DATABASE_URL: pega el «Service URI» de tu MySQL de Aiven
#    (mysql://avnadmin:...@....aivencloud.com:PUERTO/defaultdb?ssl-mode=REQUIRED).
# 3. Al terminar, la app queda en https://<nombre>.onrender.com
#      /        app (agricultor, comprador, almacén, transportista)
#      /panel   panel del equipo
#      /demo    escenario de varios celulares (pide la clave del equipo)
#    La clave del equipo (TEAM_KEY) la ves en Render → tu servicio → Environment.
# Opcional: agrega DB_CA_CERT (el «CA certificate» de Aiven) en Environment para que, además de
# cifrar, se compruebe que la base es la de Aiven.
#
# Plan gratis: se duerme a los 15 minutos sin uso y tarda cerca de un minuto en despertar.
# =============================================================================
services:
  - type: web
    name: mesagri
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: TEAM_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_CLOCK
        value: resume
      - key: TRUST_PROXY
        value: "true"
      - key: FILES_STORAGE
        value: db
      - key: DB_POOL
        value: "6"
      # Código de ingreso por SMS desde el celular Android de Mesagri (ver LEEME → «Código por SMS»)
      - key: SMS_GATEWAY_USER
        sync: false
      - key: SMS_GATEWAY_PASSWORD
        sync: false
      # celular de quien presenta: le llega el código de las cuentas de prueba (9 dígitos)
      - key: DEMO_CODES_TO
        sync: false
      # Código de ingreso por WhatsApp (opcional; ver LEEME → «Código por WhatsApp»). Sin SMS ni
      # WhatsApp, en la versión de prueba el código se muestra en pantalla.
      # Consulta del DNI en RENIEC por un proveedor (opcional; ver LEEME → «Identidad»). Sin estos
      # valores, la versión de prueba usa su padrón de prueba.
      - key: DNI_API_URL
        sync: false
      - key: DNI_API_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
